version: '3.8'

services:
  web:
    build: .
    container_name: vicare_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vicare_user
      - POSTGRES_PASSWORD=vicare_password
      - POSTGRES_DB=vicare_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=vicare-docker-secret-key-32-chars-long
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: vicare_postgres
    restart: always
    environment:
      POSTGRES_USER: vicare_user
      POSTGRES_PASSWORD: vicare_password
      POSTGRES_DB: vicare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vicare_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
